name: Deploy Frontend to Hostinger

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "vite.config.*"
      - "index.html"

  workflow_dispatch:

jobs:
  deploy:
    name: Build and Deploy Frontend
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # 3. Install dependencies
      - name: Install dependencies
        run: npm ci

      # 4. Build Vite React application
      - name: Build React application
        run: npm run build

      # 5. Deploy dist/ contents directly to Hostinger corx directory
      - name: Deploy to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}

          # Upload the contents of local dist/
          local-dir: ./dist/

          # FTP account is already rooted at /home/physiowo/corx
          # Therefore / means /home/physiowo/corx
          server-dir: /

          # Remove files from previous frontend deployment
          dangerous-clean-slate: false